    <!-- Global Shim & Error Shield for 3rd-party player tracking scripts (e.g. 200.js / M_ID) -->
    <script>
      (function() {
        try {
          if (!window.M_ID) {
            window.M_ID = {};
          }
        } catch (_) {}
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reasonStr = String(event.reason || '');
            var stackStr = String(event.reason && event.reason.stack ? event.reason.stack : '');
            if (reasonStr.includes('M_ID') || stackStr.includes('200.js') || reasonStr.includes('200.js')) {
              event.preventDefault();
            }
          } catch (_) {}
        });
        window.addEventListener('error', function(event) {
          try {
            var msg = String(event.message || '');
            var filename = String(event.filename || '');
            if (msg.includes('M_ID') || filename.includes('200.js')) {
              event.preventDefault();
              return true;
            }
          } catch (_) {}
        });
      })();
    </script>

    <!-- Early script/style load failure and stale chunk cache buster -->
    <script>
      (function() {
        function bustStaleCacheAndReload(reason) {
          console.warn('[KamiAnime CacheBuster] Stale chunk or stylesheet failure detected:', reason);
          var reloadKey = 'kami_stale_reload_timestamp';
          var lastReload = sessionStorage.getItem(reloadKey);
          var now = Date.now();
          
          // Prevent infinite reload loops (cooldown 5 seconds)
          if (!lastReload || (now - parseInt(lastReload, 10)) > 5000) {
            sessionStorage.setItem(reloadKey, String(now));
            
            // 1. Unregister all ServiceWorkers
            if ('serviceWorker' in navigator) {
              try {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) {
                    regs[i].unregister();
                  }
                });
              } catch (_) {}
            }

            // 2. Clear Cache Storage API
            if ('caches' in window) {
              try {
                caches.keys().then(function(names) {
                  for (var i = 0; i < names.length; i++) {
                    caches.delete(names[i]);
                  }
                });
              } catch (_) {}
            }

            // 3. Force hard navigation bypassing HTTP/CDN cache
            var targetUrl = window.location.pathname + (window.location.search ? window.location.search.replace(/[?&]_v=\d+/, '') : '');
            var sep = targetUrl.indexOf('?') !== -1 ? '&' : '?';
            targetUrl += sep + '_v=' + now;
            
            // Fetch fresh HTML bypassing disk cache then navigate
            if (window.fetch) {
              fetch(targetUrl, { cache: 'reload' }).then(function() {
                window.location.replace(targetUrl);
              }).catch(function() {
                window.location.replace(targetUrl);
              });
            } else {
              window.location.replace(targetUrl);
            }
          }
        }

        // Intercept asset (script/link) load errors
        window.addEventListener('error', function(e) {
          try {
            var target = e.target;
            var src = target ? (target.src || target.href || '') : '';
            var isAppAsset = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK') && (
              src.indexOf('/assets/') !== -1 || src.indexOf('/index.') !== -1
            );
            var msg = String(e.message || '');
            var isMimeOrModuleError = 
              msg.indexOf('Failed to load module script') !== -1 ||
              msg.indexOf('Strict MIME type') !== -1 ||
              msg.indexOf('supported stylesheet MIME type') !== -1 ||
              msg.indexOf('dynamically imported module') !== -1 ||
              msg.indexOf('error loading dynamically imported module') !== -1 ||
              msg.indexOf('Importing a module script failed') !== -1;

            if (isAppAsset || isMimeOrModuleError) {
              bustStaleCacheAndReload(msg || src || 'Asset load error');
            }
          } catch (_) {}
        }, true);

        // Intercept unhandled dynamic import promise rejections
        window.addEventListener('unhandledrejection', function(e) {
          try {
            var reason = e.reason;
            var msg = String((reason && (reason.message || reason)) || '');
            if (
              msg.indexOf('dynamically imported module') !== -1 ||
              msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
              msg.indexOf('error loading dynamically imported module') !== -1 ||
              msg.indexOf('Expected a JavaScript-or-Wasm module script') !== -1 ||
              msg.indexOf('Importing a module script failed') !== -1
            ) {
              bustStaleCacheAndReload(msg);
            }
          } catch (_) {}
        });
      })();
    </script>
